<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRChat Avatar Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #2c2a4a; /* Dark Violet */
            color: #e6e6fa; /* Lavender White */
            padding-bottom: 80px; /* Add padding for the mass edit bar */
        }
        .card {
            background-color: #4f4c7a; /* Muted Violet */
            border: 1px solid #7f7fd5; /* Brighter Violet */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative; /* For checkbox positioning */
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .btn-primary {
            background-color: #7f7fd5; /* Brighter Violet */
            color: #1e1e2f;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #6a6ad1;
        }
        .btn-danger {
            background-color: #c73866; /* Magenta */
            transition: background-color 0.3s;
        }
        .btn-danger:hover {
            background-color: #b3315a;
        }
        .btn-secondary {
            background-color: #6b6d85; /* Greyish Violet */
            transition: background-color 0.3s;
        }
        .btn-secondary:hover {
             background-color: #5a5c72;
        }
        input[type="text"], input[type="url"], input[type="search"], textarea, select {
            background-color: #4f4c7a; /* Muted Violet */
            border: 1px solid #7f7fd5; /* Brighter Violet */
            color: #e6e6fa;
        }
        input::placeholder, textarea::placeholder {
            color: #b0b0d0;
        }
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            padding-right: 2.5rem; /* space for arrow */
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239e9ecb' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
        .modal-backdrop {
            background-color: rgba(0,0,0,0.7);
        }
        .modal-content {
            background-color: #2c2a4a; /* Dark Violet */
        }
        .platform-icon {
            width: 24px; /* Slightly larger for better visibility */
            height: 24px;
            padding: 2px; /* Small padding inside the circle */
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box; /* Include padding in width/height */
        }
        .platform-icon.pc {
            border: 2px solid #0078D4; /* Windows blue */
            color: #0078D4;
        }
        .platform-icon.quest {
            border: 2px solid #3DDC84; /* Android green */
            color: #3DDC84;
        }
        
        /* Mass Edit Styles */
        #mass-edit-action-bar {
            background-color: #1e1e2f; /* Darker base */
            border-top: 1px solid #7f7fd5;
        }
        .mass-edit-checkbox {
            display: none; /* Hidden by default */
            width: 1.5rem;
            height: 1.5rem;
            accent-color: #a855f7; /* Purple */
        }
        .card-buttons {
            display: flex; /* Visible by default */
        }

        /* When in mass edit mode */
        body.mass-edit-active .mass-edit-checkbox {
            display: block; /* Show checkboxes */
        }
        body.mass-edit-active .card-buttons {
            display: none; /* Hide individual buttons */
        }
    </style>
</head>
<body class="antialiased">
    <!-- Notification Element -->
    <div id="notification" class="fixed top-5 right-5 bg-red-600 text-white p-4 rounded-lg shadow-lg z-50 hidden transition-opacity duration-300 max-w-sm">
    </div>

    <!-- Main App Container -->
    <div id="app-container">
        <div class="container mx-auto p-4 md:p-8">
            <header class="text-center mb-8 relative">
                <div class="absolute -left-4 md:-left-8 top-0 flex gap-2">
                    <button id="export-all-btn" class="btn-primary text-white font-bold py-1.5 px-3 rounded-md shadow-md text-sm">Export All</button>
                    <button id="import-all-btn" class="btn-secondary text-white font-bold py-1.5 px-3 rounded-md shadow-md text-sm">Import All</button>
                    <input id="import-file-input" type="file" accept=".txt,.json" class="hidden" />
                </div>
                <h1 class="text-4xl md:text-5xl font-bold text-white mb-2 flex items-center justify-center space-x-2">
                    <span>🐰</span>
                    <span>VRChat Avatar Log</span>
                    <span>🦊</span>
                </h1>
                <p class="text-lg text-gray-400">Your personal database of discovered avatars.</p>
            </header>

            <div class="card rounded-lg p-6 mb-8 max-w-2xl mx-auto shadow-lg">
                <h2 class="text-2xl font-semibold mb-4 text-white">Add New Avatar</h2>
                <form id="add-avatar-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label for="avatarName" class="block mb-2 text-sm font-medium">Avatar Name</label>
                        <input type="text" id="avatarName" placeholder="e.g., Cyberpunk Fox" class="w-full rounded-md p-2" required>
                    </div>
                    <div>
                        <label for="avatarId" class="block mb-2 text-sm font-medium">Avatar ID</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="avatarId" placeholder="avtr_..." class="w-full rounded-md p-2" required>
                            <button type="button" id="lookupAvatarBtn" class="btn-secondary text-white font-bold p-2 rounded-md h-full" title="Look up Avatar ID">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label for="creatorName" class="block mb-2 text-sm font-medium">Creator Name</label>
                        <input type="text" id="creatorName" placeholder="e.g., Rexouium" class="w-full rounded-md p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label for="imageUrl" class="block mb-2 text-sm font-medium">Image URL</label>
                        <input type="url" id="imageUrl" placeholder="https://..." class="w-full rounded-md p-2">
                    </div>
                    <!-- Platform Checkboxes removed from Add form -->
                    <div class="md:col-span-2">
                        <label for="notes" class="block mb-2 text-sm font-medium">Notes</label>
                        <textarea id="notes" rows="3" placeholder="Cool shaders, custom animations, etc." class="w-full rounded-md p-2"></textarea>
                    </div>
                    <div class="md:col-span-2 text-right">
                        <button type="submit" class="btn-primary text-white font-bold py-2 px-4 rounded-md shadow-md">
                            Add Avatar
                        </button>
                    </div>
                </form>
            </div>

            <!-- Import Avatars Card -->
            <div class="card rounded-lg p-6 mb-8 max-w-2xl mx-auto shadow-lg">
                <h2 class="text-2xl font-semibold mb-4 text-white">Import Avatars</h2>
                <p class="text-gray-300 mb-4">Paste your avatar list below. Each avatar on a new line, in this format:<br><code class="text-sm bg-gray-900 px-1 py-0.5 rounded">ID,Name,Author,ImageURL</code></p>
                <textarea id="import-textarea" rows="5" placeholder="avtr_...,Cyberpunk Fox,Rexouium,https://..." class="w-full rounded-md p-2 mb-4"></textarea>
                <div class="flex justify-between items-center">
                    <button id="import-btn" class="btn-primary text-white font-bold py-2 px-4 rounded-md shadow-md">
                        Import List
                    </button>
                    <span id="import-status" class="text-gray-400 text-sm"></span>
                </div>
            </div>

            <!-- Search, Folder, and Edit Controls -->
            <div class="mb-8 max-w-4xl mx-auto space-y-4">
                <!-- Search Bar -->
                <div>
                    <label for="searchBar" class="block mb-2 text-sm font-medium text-gray-300">Search</label>
                    <input type="search" id="searchBar" placeholder="Search by name, creator, ID, or 'pc' / 'quest'..." class="w-full rounded-md p-3 transition">
                </div>

                <!-- Folder Management -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="new-folder-name" class="block mb-2 text-sm font-medium text-gray-300">Create New Folder</label>
                        <div class="flex gap-2">
                            <input type="text" id="new-folder-name" placeholder="e.g., Furry Avatars" class="w-full rounded-md p-2">
                            <button id="add-folder-btn" class="btn-primary text-white font-bold py-2 px-4 rounded-md shadow-md">Add</button>
                        </div>
                    </div>
                </div>
                
                <!-- Navigation Bar -->
                <div id="navigation-bar" class="my-4 flex items-center justify-between">
                    <h2 id="current-view-title" class="text-2xl font-semibold text-white">Folders</h2>
                    <button id="back-to-root-btn" class="btn-secondary text-white font-bold py-2 px-4 rounded-md shadow-md hidden">
                        &larr; Back to Folders
                    </button>
                </div>

                <!-- Search Bar -->
                
                <!-- Mass Edit Button and Utilities -->
                <div class="flex gap-2">
                    <button id="mass-edit-btn" class="btn-secondary text-white font-bold py-2 px-4 rounded-md shadow-md w-full md:w-auto">Mass Edit</button>
                    <button id="remove-duplicates-btn" class="btn-secondary text-white font-bold py-2 px-4 rounded-md shadow-md w-full md:w-auto">Remove Duplicates</button>
                    <button id="undo-btn" class="btn-secondary text-white font-bold py-2 px-4 rounded-md shadow-md w-full md:w-auto disabled:opacity-50 disabled:cursor-not-allowed" disabled>Undo</button>
                </div>
            </div>

            <div id="item-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Avatar and Folder cards will be inserted here -->
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="edit-modal" class="fixed inset-0 z-50 items-center justify-center hidden flex modal-backdrop">
            <div class="modal-content rounded-lg p-6 shadow-xl w-full max-w-2xl">
                <h2 class="text-2xl font-semibold mb-4 text-white">Edit Avatar</h2>
                <form id="edit-avatar-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                     <input type="hidden" id="editAvatarIdInput">
                    <div class="md:col-span-2">
                        <label for="editAvatarName" class="block mb-2 text-sm font-medium">Avatar Name</label>
                        <input type="text" id="editAvatarName" class="w-full rounded-md p-2" required>
                    </div>
                    <div>
                        <label for="editAvatarId" class="block mb-2 text-sm font-medium">Avatar ID</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="editAvatarId" class="w-full rounded-md p-2" required>
                            <button type="button" id="lookupEditAvatarBtn" class="btn-secondary text-white font-bold p-2 rounded-md h-full" title="Look up Avatar ID">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label for="editCreatorName" class="block mb-2 text-sm font-medium">Creator Name</label>
                        <input type="text" id="editCreatorName" class="w-full rounded-md p-2">
                    </div>
                    <div class="md:col-span-2">
                        <label for="editImageUrl" class="block mb-2 text-sm font-medium">Image URL</label>
                        <input type="url" id="editImageUrl" class="w-full rounded-md p-2">
                    </div>
                    <!-- Platform Checkboxes for Edit Modal -->
                    <div class="md:col-span-2 flex items-center gap-4 mt-2">
                        <label class="flex items-center space-x-2 text-white">
                            <input type="checkbox" id="editIsPC" class="form-checkbox text-purple-600">
                            <span>PC Compatible</span>
                        </label>
                        <label class="flex items-center space-x-2 text-white">
                            <input type="checkbox" id="editIsQuest" class="form-checkbox text-purple-600">
                            <span>Quest Compatible</span>
                        </label>
                    </div>
                    <div class="md:col-span-2">
                        <label for="editNotes" class="block mb-2 text-sm font-medium">Notes</label>
                        <textarea id="editNotes" rows="3" class="w-full rounded-md p-2"></textarea>
                    </div>
                    <div class="md:col-span-2 flex justify-end gap-4">
                        <button type="button" id="cancel-edit" class="btn-secondary text-white font-bold py-2 px-4 rounded-md">Cancel</button>
                        <button type="submit" class="btn-primary text-white font-bold py-2 px-4 rounded-md">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Mass Edit Action Bar -->
    <div id="mass-edit-action-bar" class="fixed bottom-0 left-0 right-0 p-4 shadow-lg z-40 hidden">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <span class="text-white font-semibold text-lg">Mass Edit Mode</span>
            <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                <div class="flex items-center gap-2">
                    <label for="move-to-folder" class="text-gray-300 text-sm">Move to:</label>
                    <select id="move-to-folder" class="rounded-md p-2 text-sm">
                        <!-- Folder options will be inserted here -->
                    </select>
                    <button id="mass-move-btn" class="btn-primary text-white font-bold py-2 px-3 rounded-md shadow-md text-sm">Move</button>
                </div>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-2 text-gray-300 text-sm">
                        <input type="checkbox" id="mass-set-pc" class="form-checkbox text-purple-600">
                        <span>PC</span>
                    </label>
                    <label class="flex items-center gap-2 text-gray-300 text-sm">
                        <input type="checkbox" id="mass-set-quest" class="form-checkbox text-purple-600">
                        <span>Quest</span>
                    </label>
                    <button id="mass-apply-platform-btn" class="btn-primary text-white font-bold py-2 px-3 rounded-md shadow-md text-sm">Apply</button>
                </div>
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 text-gray-300 text-sm">
                        <input id="mass-select-all" type="checkbox" class="mass-edit-checkbox" style="display: inline-block; width: 1rem; height: 1rem;">
                        <span>Select All</span>
                    </label>
                    <button id="mass-export-btn" class="btn-primary text-white font-bold py-2 px-3 rounded-md shadow-md text-sm">Export Selected</button>
                    <button id="mass-delete-btn" class="btn-danger text-white font-bold py-2 px-3 rounded-md shadow-md text-sm">Delete Selected</button>
                    <button id="cancel-mass-edit-btn" class="btn-secondary text-white font-bold py-2 px-3 rounded-md shadow-md text-sm">Done</button>
                </div>
            </div>
        </div>
    </div>


    <script type="module">
        // --- DOM Elements ---
        const itemList = document.getElementById('item-list'); // Renamed from avatarList
        const addAvatarForm = document.getElementById('add-avatar-form');
        const editModal = document.getElementById('edit-modal');
        const editAvatarForm = document.getElementById('edit-avatar-form');
        const cancelEditBtn = document.getElementById('cancel-edit');
        const searchBar = document.getElementById('searchBar');
        const lookupAvatarBtn = document.getElementById('lookupAvatarBtn');
        const lookupEditAvatarBtn = document.getElementById('lookupEditAvatarBtn');
        const importTextarea = document.getElementById('import-textarea');
        const importBtn = document.getElementById('import-btn');
        const importStatus = document.getElementById('import-status');

        // --- New Folder/Mass Edit DOM Elements ---
        const newFolderInput = document.getElementById('new-folder-name');
        const addFolderBtn = document.getElementById('add-folder-btn');
        const massEditBtn = document.getElementById('mass-edit-btn');
        const massEditActionBar = document.getElementById('mass-edit-action-bar');
        const moveToFolderSelect = document.getElementById('move-to-folder');
        const massMoveBtn = document.getElementById('mass-move-btn');
        const massDeleteBtn = document.getElementById('mass-delete-btn');
        const cancelMassEditBtn = document.getElementById('cancel-mass-edit-btn');
        const massExportBtn = document.getElementById('mass-export-btn'); // New Export Button
        const removeDuplicatesBtn = document.getElementById('remove-duplicates-btn');
        const massSelectAll = document.getElementById('mass-select-all');
        const massSetPC = document.getElementById('mass-set-pc');
        const massSetQuest = document.getElementById('mass-set-quest');
        const massApplyPlatformBtn = document.getElementById('mass-apply-platform-btn');
        const exportAllBtn = document.getElementById('export-all-btn');
        const importAllBtn = document.getElementById('import-all-btn');
        const importFileInput = document.getElementById('import-file-input');
        const undoBtn = document.getElementById('undo-btn');
        
        // --- New Navigation Elements ---
        const currentViewTitle = document.getElementById('current-view-title');
        const backToRootBtn = document.getElementById('back-to-root-btn');

        // --- Storage Keys ---
        const STORAGE_KEY = 'vrchatAvatarLog';
        const STORAGE_KEY_FOLDERS = 'vrchatAvatarFolders';
        const COOKIE_NAME = 'vrchatAvatarLog'; // For migration
        const STORAGE_KEY_UNDO = 'vrchatAvatarLogUndo';
        const STORAGE_KEY_FOLDERS_UNDO = 'vrchatAvatarFoldersUndo';

        // --- App State ---
        let isMassEditMode = false;
        let currentFolderId = null; // null = Root view, string = Folder view

        // --- Notification ---
        const showNotification = (message, duration = 5000) => {
            const notification = document.getElementById('notification');
            if (!notification) return;
            notification.textContent = message;
            notification.classList.remove('hidden');
            setTimeout(() => {
                notification.classList.add('hidden');
            }, duration);
        };

        // --- Undo System ---
        const saveUndoState = () => {
            try {
                const avatars = getAvatarsFromStorage();
                const folders = getFoldersFromStorage();
                localStorage.setItem(STORAGE_KEY_UNDO, JSON.stringify(avatars));
                localStorage.setItem(STORAGE_KEY_FOLDERS_UNDO, JSON.stringify(folders));
                updateUndoButtonState();
            } catch (e) {
                console.error("Error saving undo state:", e);
            }
        };

        const hasUndoState = () => {
            try {
                const avatarsUndo = localStorage.getItem(STORAGE_KEY_UNDO);
                const foldersUndo = localStorage.getItem(STORAGE_KEY_FOLDERS_UNDO);
                return avatarsUndo !== null && foldersUndo !== null;
            } catch (e) {
                return false;
            }
        };

        const restoreUndoState = () => {
            try {
                const avatarsUndo = localStorage.getItem(STORAGE_KEY_UNDO);
                const foldersUndo = localStorage.getItem(STORAGE_KEY_FOLDERS_UNDO);
                
                if (!avatarsUndo || !foldersUndo) {
                    showNotification("No undo state available.", 3000);
                    return false;
                }

                const avatars = JSON.parse(avatarsUndo);
                const folders = JSON.parse(foldersUndo);

                // Validate the data before restoring
                if (!Array.isArray(avatars) || !Array.isArray(folders)) {
                    showNotification("Error: Invalid undo state data.", 5000);
                    return false;
                }

                // Restore the state
                saveAvatarsToStorage(avatars);
                saveFoldersToStorage(folders);

                // Clear undo state after restoring
                localStorage.removeItem(STORAGE_KEY_UNDO);
                localStorage.removeItem(STORAGE_KEY_FOLDERS_UNDO);
                updateUndoButtonState();

                // Re-render the view
                renderFolderOptions();
                renderCurrentView();
                
                showNotification("Changes undone successfully.", 3000);
                return true;
            } catch (e) {
                console.error("Error restoring undo state:", e);
                showNotification("Error: Failed to restore undo state.", 5000);
                return false;
            }
        };

        const updateUndoButtonState = () => {
            if (undoBtn) {
                if (hasUndoState()) {
                    undoBtn.disabled = false;
                    undoBtn.classList.remove('disabled:opacity-50', 'disabled:cursor-not-allowed');
                } else {
                    undoBtn.disabled = true;
                    undoBtn.classList.add('disabled:opacity-50', 'disabled:cursor-not-allowed');
                }
            }
        };

        if (undoBtn) {
            undoBtn.addEventListener('click', () => {
                if (hasUndoState()) {
                    if (confirm("Are you sure you want to undo the last operation? This will restore the previous state.")) {
                        restoreUndoState();
                    }
                } else {
                    showNotification("No undo state available.", 3000);
                }
            });
        }

        // --- Text Escaping Helpers ---
        const ensureString = (value) => (value === undefined || value === null) ? '' : String(value);
        const escapeHTML = (value) => {
            const text = ensureString(value);
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };
        const csvEscape = (value) => {
            const text = ensureString(value);
            const needsQuoting = /[",\n]/.test(text);
            const escaped = text.replace(/"/g, '""');
            return needsQuoting ? `"${escaped}"` : escaped;
        };

        // --- Import/Export helpers ---
        const tryParseJson = (text) => { try { return JSON.parse(text); } catch { return null; } };
        const isValidImportedPayload = (obj) => {
            if (!obj || typeof obj !== 'object') return false;
            return Array.isArray(obj.folders) && Array.isArray(obj.avatars);
        };
        const normalizeFolders = (folders) => {
            if (!Array.isArray(folders)) return [];
            return folders
                .filter(f => f && (f.id || f.name))
                .map(f => ({ id: ensureString(f.id) || crypto.randomUUID(), name: ensureString(f.name || 'Folder') }));
        };
        const normalizeAvatars = (avatars) => {
            if (!Array.isArray(avatars)) return [];
            return avatars
                .filter(a => a && (a.avatarId || a.avatarName))
                .map(a => ({
                    id: ensureString(a.id) || crypto.randomUUID(),
                    avatarName: ensureString(a.avatarName || 'Unnamed'),
                    avatarId: ensureString(a.avatarId || ''),
                    creatorName: ensureString(a.creatorName || ''),
                    imageUrl: ensureString(a.imageUrl || ''),
                    isPC: !!(a.isPC !== undefined ? a.isPC : true),
                    isQuest: !!(a.isQuest !== undefined ? a.isQuest : true),
                    notes: ensureString(a.notes || ''),
                    folderId: (a.folderId === null || a.folderId === undefined) ? null : ensureString(a.folderId)
                }));
        };
        const mergeFoldersByName = (existingFolders, incomingFolders) => {
            const nameToExisting = new Map(existingFolders.map(f => [f.name.toLowerCase(), f]));
            const idRemap = new Map(); // incomingId -> finalId
            const merged = existingFolders.slice();
            for (const inf of incomingFolders) {
                const key = inf.name.toLowerCase();
                if (nameToExisting.has(key)) {
                    const existing = nameToExisting.get(key);
                    idRemap.set(inf.id, existing.id);
                } else {
                    const idInUse = merged.some(f => f.id === inf.id);
                    const finalId = idInUse ? crypto.randomUUID() : inf.id;
                    const nf = { id: finalId, name: inf.name };
                    merged.push(nf);
                    nameToExisting.set(key, nf);
                    idRemap.set(inf.id, finalId);
                }
            }
            return { merged, idRemap };
        };
        const dedupeAvatars = (existingAvatars, incomingAvatars, folderIdMap) => {
            const result = existingAvatars.slice();
            const keyOf = (a) => (a.avatarId && a.avatarId.startsWith('avtr_'))
                ? `id:${a.avatarId}`
                : `name:${a.avatarName.toLowerCase()}|by:${(a.creatorName||'').toLowerCase()}`;
            const have = new Set(result.map(keyOf));
            for (const a of incomingAvatars) {
                const key = keyOf(a);
                if (have.has(key)) continue; // keep existing, don't override
                const mappedFolderId = (a.folderId == null) ? null : (folderIdMap.get(a.folderId) || null);
                let finalId = a.id;
                if (result.some(x => x.id === finalId)) finalId = crypto.randomUUID();
                result.push({ ...a, id: finalId, folderId: mappedFolderId });
                have.add(key);
            }
            return result;
        };
        const exportAllData = () => {
            try {
                const folders = getFoldersFromStorage();
                const avatars = getAvatarsFromStorage();
                const payload = { version: 1, exportedAt: new Date().toISOString(), folders, avatars };
                const json = JSON.stringify(payload, null, 2);
                const blob = new Blob(['\ufeff' + json], { type: 'text/plain;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', 'vrchat_avatar_log_export.txt');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showNotification('Exported all folders and avatars.', 3000);
            } catch (e) {
                console.error('Export failed:', e);
                showNotification('Export failed.', 5000);
            }
        };
        const importAllDataFromText = (text) => {
            const obj = tryParseJson(text);
            if (!isValidImportedPayload(obj)) {
                showNotification('Invalid import file format.', 5000);
                return;
            }
            const existingFolders = getFoldersFromStorage();
            const existingAvatars = getAvatarsFromStorage();
            const normalizedFolders = normalizeFolders(obj.folders);
            const normalizedAvatars = normalizeAvatars(obj.avatars);
            const { merged: mergedFolders, idRemap } = mergeFoldersByName(existingFolders, normalizedFolders);
            const mergedAvatars = dedupeAvatars(existingAvatars, normalizedAvatars, idRemap);
            
            // Calculate how many were actually added (not duplicates)
            const actuallyAdded = mergedAvatars.length - existingAvatars.length;
            const duplicateCount = normalizedAvatars.length - actuallyAdded;
            
            saveFoldersToStorage(mergedFolders);
            saveAvatarsToStorage(mergedAvatars);
            renderFolderOptions();
            renderCurrentView();
            
            let message = '';
            if (actuallyAdded > 0) {
                message = `Imported ${actuallyAdded} new avatar(s) and ${normalizedFolders.length} folder(s).`;
                if (duplicateCount > 0) {
                    message += ` ${duplicateCount} duplicate(s) skipped.`;
                }
            } else if (duplicateCount > 0) {
                message = `No new avatars imported. ${duplicateCount} duplicate(s) found and skipped.`;
            } else {
                message = `Imported ${normalizedFolders.length} folder(s). No new avatars to import.`;
            }
            showNotification(message, 6000);
        };

        // --- Storage Functions (Folders) ---
        const getFoldersFromStorage = () => {
            const folderData = localStorage.getItem(STORAGE_KEY_FOLDERS);
            if (folderData) {
                try {
                    return JSON.parse(folderData);
                } catch (e) {
                    console.error("Error parsing folders:", e);
                    return [];
                }
            }
            return [];
        };

        const saveFoldersToStorage = (folders) => {
            try {
                localStorage.setItem(STORAGE_KEY_FOLDERS, JSON.stringify(folders));
            } catch (e) {
                console.error("Error saving folders:", e);
                showNotification("Error: Could not save folder data.", 5000);
            }
        };

        // --- Storage Functions (Avatars) ---
        const saveAvatarsToStorage = (avatars) => {
            try {
                const jsonValue = JSON.stringify(avatars);
                localStorage.setItem(STORAGE_KEY, jsonValue);
            } catch (e) {
                console.error("Error saving avatars to localStorage:", e);
                showNotification("Error: Could not save avatar data. Storage might be full.", 5000);
            }
        };

        const getAvatarsFromCookieForMigration = () => {
            const cookieValue = document.cookie
                .split('; ')
                .find(row => row.startsWith(`${COOKIE_NAME}=`));

            if (cookieValue) {
                try {
                    return JSON.parse(decodeURIComponent(cookieValue.split('=')[1]));
                } catch (e) {
                    console.error("Error parsing avatars from cookie for migration:", e);
                    return null;
                }
            }
            return null;
        };
        
        const clearOldCookie = () => {
             document.cookie = `${COOKIE_NAME}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSiteLax`;
        };

        const getAvatarsFromStorage = () => {
            // 1. Try localStorage first
            const localData = localStorage.getItem(STORAGE_KEY);
            if (localData) {
                try {
                    // No folder migration needed here, will be handled on load
                    return JSON.parse(localData);
                } catch (e) {
                    console.error("Error parsing avatars from localStorage:", e);
                    return [];
                }
            }

            // 2. If no localStorage, try migrating from cookie
            const cookieData = getAvatarsFromCookieForMigration();
            if (cookieData && Array.isArray(cookieData) && cookieData.length > 0) {
                console.log("Migrating avatar data from cookie to localStorage...");
                const migratedData = cookieData.map(avatar => ({
                    ...avatar,
                    isPC: avatar.isPC !== undefined ? avatar.isPC : true,
                    isQuest: avatar.isQuest !== undefined ? avatar.isQuest : false,
                    folderId: null // Add folderId during migration
                }));
                saveAvatarsToStorage(migratedData);
                clearOldCookie();
                showNotification(`Migrated ${migratedData.length} avatars to new storage.`, 4000);
                return migratedData;
            }
            
            // 3. If nothing, return empty array
            return [];
        };

        // --- Folder UI ---
        const renderFolderOptions = () => {
            const folders = getFoldersFromStorage();
            // Clear existing options (but keep defaults)
            moveToFolderSelect.innerHTML = `
                <option value="uncategorized">Uncategorized</option>
            `; // 'Move to All' doesn't make sense

            folders.forEach(folder => {
                const optionHTML = `<option value="${folder.id}">${escapeHTML(folder.name)}</option>`;
                moveToFolderSelect.innerHTML += optionHTML;
            });
        };

        const handleAddFolder = () => {

            const newFolder = {
                id: crypto.randomUUID(),
                name: folderName
            };
            folders.push(newFolder);
            saveFoldersToStorage(folders);
            
            newFolderInput.value = '';
            renderFolderOptions(); // Update the 'move to' dropdown
            renderCurrentView(); // Re-render the main view to show new folder
            showNotification(`Folder "${folderName}" created!`, 3000);
        };

        addFolderBtn.addEventListener('click', handleAddFolder);

        // --- Navigation ---
        const navigateToFolder = (folderId) => {

        };

        const navigateToRoot = () => {

        backToRootBtn.addEventListener('click', navigateToRoot);


        // --- Render Folder Card ---
        const renderFolderCard = (folder, avatarCount) => {
            const card = document.createElement('div');
            card.className = 'card rounded-lg p-4 flex flex-col shadow-lg';
            card.innerHTML = `
                <div class="flex-grow">

                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />

            card.addEventListener('click', (e) => {
                if (isMassEditMode) {
                    // If in mass edit, toggle the checkbox
                    const checkbox = card.querySelector('.mass-edit-checkbox');
                    if (e.target !== checkbox) {
                         checkbox.checked = !checkbox.checked;
                    }
                    return;
                }
                if (e.target.closest('button')) {

                }
                if (avatar.avatarId && avatar.avatarId.trim().startsWith('avtr_')) {
                    const url = `vrcx://switchavatar/${avatar.avatarId.trim()}`;
                    window.location.href = url;
                }
            });

            card.querySelector('.select-btn').addEventListener('click', handleSelect);
            card.querySelector('.edit-btn').addEventListener('click', openEdit);
            card.querySelector('.delete-btn').addEventListener('click', handleDelete);
        };

        // --- Main Render Function ---
        const renderCurrentView = () => {
            const searchTerm = searchBar.value.toLowerCase();
            const allAvatars = getAvatarsFromStorage();
            const allFolders = getFoldersFromStorage();
            
            itemList.innerHTML = ''; // Clear the list

            if (currentFolderId === null) {
                // --- ROOT VIEW ---
                currentViewTitle.textContent = 'Folders';
                backToRootBtn.classList.add('hidden');

                // 1. Render Folders
                const filteredFolders = allFolders.filter(folder => 
                    folder.name.toLowerCase().includes(searchTerm)
                );

                if (filteredFolders.length > 0) {
                    filteredFolders.forEach(folder => {
                        const avatarCount = allAvatars.filter(a => a.folderId === folder.id).length;
                        renderFolderCard(folder, avatarCount);
                    });
                }

                // 2. Render Uncategorized Avatars
                // Search only applies to folders OR uncategorized avatars, not both at same time?
                // Let's search both.
                const uncategorizedAvatars = allAvatars.filter(avatar => 
                    !avatar.folderId && (
                        avatar.avatarName.toLowerCase().includes(searchTerm) ||
                        (avatar.creatorName || '').toLowerCase().includes(searchTerm) ||
                        avatar.avatarId.toLowerCase().includes(searchTerm) ||
                        (searchTerm.includes('pc') && avatar.isPC) ||
                        (searchTerm.includes('quest') && avatar.isQuest)
                    )
                );

                if (uncategorizedAvatars.length > 0) {
                    // Add a divider/title
                    const divider = document.createElement('h3');
                    divider.className = "text-xl font-semibold text-gray-300 col-span-full mt-6 mb-2";
                    divider.textContent = "Uncategorized Avatars";
                    itemList.appendChild(divider);
                    
                    uncategorizedAvatars.forEach(avatar => {
                        renderAvatarCard(avatar);
                    });
                }

                if (filteredFolders.length === 0 && uncategorizedAvatars.length === 0) {
                     itemList.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10"><p>No folders or avatars found.</p></div>`;
                }

            } else {
                // --- FOLDER VIEW ---
                const folder = allFolders.find(f => f.id === currentFolderId);
                currentViewTitle.textContent = folder ? folder.name : 'Folder';
                backToRootBtn.classList.remove('hidden');

                // Filter avatars in this folder
                const avatarsInFolder = allAvatars.filter(avatar => 
                    avatar.folderId === currentFolderId && (
                        avatar.avatarName.toLowerCase().includes(searchTerm) ||
                        (avatar.creatorName || '').toLowerCase().includes(searchTerm) ||
                        avatar.avatarId.toLowerCase().includes(searchTerm) ||
                        (searchTerm.includes('pc') && avatar.isPC) ||
                        (searchTerm.includes('quest') && avatar.isQuest)
                    )
                );

                if (avatarsInFolder.length > 0) {
                    avatarsInFolder.forEach(avatar => {
                        renderAvatarCard(avatar);
                    });
                } else {
                     itemList.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10"><p>No avatars found in this folder.</p></div>`;
                }
            }
        };

        searchBar.addEventListener('input', renderCurrentView);
        
        // --- Select Avatar (Placeholder) ---
        const selectAvatar = (avatarId) => {

        // --- Look Up Avatar ID ---
        const handleLookup = (idFieldId) => {

        };

        lookupAvatarBtn.addEventListener('click', () => handleLookup('avatarId'));

        addAvatarForm.addEventListener('submit', (e) => {

                avatarName: addAvatarForm.avatarName.value,
                avatarId: addAvatarForm.avatarId.value,

                imageUrl: addAvatarForm.imageUrl.value,
                isPC: true,
                isQuest: false,
                notes: addAvatarForm.notes.value,
                folderId: currentFolderId // null if in root, folderId if in folder
            };
            avatars.push(newAvatar);
            saveAvatarsToStorage(avatars);
            
            searchBar.value = '';
            renderCurrentView(); // Re-render with filters
            addAvatarForm.reset();
        });

        // --- Import Avatars ---
        importBtn.addEventListener('click', () => {
            const importText = importTextarea.value;
            if (!importText.trim()) {
                showNotification("Import field is empty.", 4000);
                return;
            }

            const lines = importText.split('\n');
            let avatars = getAvatarsFromStorage();
            let importedCount = 0;
            let errorCount = 0;
            let duplicateCount = 0;

            // Create a Set of existing avatarIds for quick duplicate checking
            const existingAvatarIds = new Set(avatars.map(a => a.avatarId && a.avatarId.trim()).filter(Boolean));

            let startLine = 0;
            if (lines.length > 0) {
                const firstLineLower = lines[0].trim().toLowerCase();
                if (firstLineLower.startsWith('id,name,author') || firstLineLower.startsWith('id,name,thumbnail,author')) {
                    startLine = 1; // Skip the header row
                }
            }

            for (let i = startLine; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                const parts = line.split(',');
                // Expected format: ID,Name,Author,ImageURL
                if (parts.length >= 4) { 
                    const avatarId = parts[0].trim();
                    const avatarName = parts[1].trim();
                    const creatorName = parts[2].trim();
                    const imageUrl = parts[3].trim();
                    const isPC = true;
                    const isQuest = true; // Default to true

                    if (avatarId.startsWith('avtr_') && avatarName) {
                        // Check for duplicate avatarId
                        if (existingAvatarIds.has(avatarId)) {
                            duplicateCount++;
                            continue; // Skip this duplicate
                        }

                        const newAvatar = {
                            id: crypto.randomUUID(),
                            avatarId: avatarId,
                            avatarName: avatarName,
                            creatorName: creatorName || 'Unknown',
                            imageUrl: imageUrl || '',
                            isPC: isPC,
                            isQuest: isQuest,
                            notes: 'Imported',
                            folderId: currentFolderId // null if in root, folderId if in folder
                        };
                        avatars.push(newAvatar);
                        existingAvatarIds.add(avatarId); // Track newly added avatarId to prevent duplicates within the same import
                        importedCount++;
                    } else {
                        errorCount++;
                    }
                } else {
                    errorCount++;
                }
            }

            saveAvatarsToStorage(avatars);
            
            // Build status message
            let statusMessage = '';
            if (importedCount > 0) {
                statusMessage = `Successfully imported ${importedCount} avatar(s).`;

                showNotification(`No new avatars imported. ${duplicateCount} duplicate(s) found and skipped.`, 5000);
            }

            if (errorCount > 0) {
                importStatus.textContent = `${errorCount} line(s) failed to import.`;
                if (duplicateCount > 0) {
                    importStatus.textContent += ` ${duplicateCount} duplicate(s) skipped.`;
                }

                    showNotification(`Failed to import ${errorCount} line(s). Check format.`, 5000);
                }

                importStatus.textContent = `Imported ${importedCount}!`;

            return Array.from(checkboxes).map(cb => cb.dataset.id);

        // --- Mass Select All ---
        const setAllMassSelection = (checked) => {
            const checkboxes = document.querySelectorAll('.mass-edit-checkbox');
            checkboxes.forEach(cb => {
                if (cb && cb.dataset && 'id' in cb.dataset) {
                    cb.checked = checked;
                }
            });
        };
        if (massSelectAll) {
            massSelectAll.addEventListener('change', (e) => {
                setAllMassSelection(e.target.checked);
            });
        }

        massDeleteBtn.addEventListener('click', () => {
            const idsToDelete = getSelectedAvatarIds();
            if (idsToDelete.length === 0) {
                showNotification("No avatars selected.", 3000);
                return;
            }

            // Save undo state before deletion
            saveUndoState();

            let avatars = getAvatarsFromStorage();
            avatars = avatars.filter(avatar => !idsToDelete.includes(avatar.id));
            saveAvatarsToStorage(avatars);
            
            showNotification(`Deleted ${idsToDelete.length} avatars.`, 3000);
            renderCurrentView();
        });

        massMoveBtn.addEventListener('click', () => {
            const idsToMove = getSelectedAvatarIds();
            if (idsToMove.length === 0) {
                showNotification("No avatars selected.", 3000);
                return;
            }

            // Save undo state before moving
            saveUndoState();

            const targetFolderId = moveToFolderSelect.value === 'uncategorized' ? null : moveToFolderSelect.value;
            
            let avatars = getAvatarsFromStorage();
            avatars = avatars.map(avatar => {
                if (idsToMove.includes(avatar.id)) {
                    avatar.folderId = targetFolderId;
                }
                return avatar;
            });
            saveAvatarsToStorage(avatars);

            showNotification(`Moved ${idsToMove.length} avatars.`, 3000);
            renderCurrentView();
        });

        massApplyPlatformBtn.addEventListener('click', () => {
            const idsToUpdate = getSelectedAvatarIds();
            if (idsToUpdate.length === 0) {
                showNotification("No avatars selected.", 3000);
                return;
            }

            const setPC = massSetPC.checked;
            const setQuest = massSetQuest.checked;
            
            // If neither checkbox is checked, don't apply changes
            if (!setPC && !setQuest) {
                showNotification("Please select at least one platform (PC or Quest).", 3000);
                return;
            }

            // Save undo state before applying platform changes
            saveUndoState();

            let avatars = getAvatarsFromStorage();
            avatars = avatars.map(avatar => {
                if (idsToUpdate.includes(avatar.id)) {
                    avatar.isPC = setPC;
                    avatar.isQuest = setQuest;
                }
                return avatar;
            });
            saveAvatarsToStorage(avatars);

            showNotification(`Updated ${idsToUpdate.length} avatar(s) platform compatibility.`, 3000);
            renderCurrentView();
        });

        // --- Remove Duplicate Avatars ---
        const removeDuplicateAvatars = () => {
            const allAvatars = getAvatarsFromStorage();
            
            // Failsafe 1: Validate we have avatars
            if (!Array.isArray(allAvatars) || allAvatars.length === 0) {
                showNotification("No avatars found to check for duplicates.", 3000);
                return;
            }

            // Group avatars by exact avatarId (case-sensitive, trimmed)
            const avatarIdMap = new Map();
            const validAvatars = allAvatars.filter(avatar => {
                // Failsafe 2: Only process avatars with valid, non-empty avatarIds
                return avatar && avatar.avatarId && typeof avatar.avatarId === 'string' && avatar.avatarId.trim().length > 0;
            });

            validAvatars.forEach(avatar => {
                const normalizedId = avatar.avatarId.trim();
                if (!avatarIdMap.has(normalizedId)) {
                    avatarIdMap.set(normalizedId, []);
                }
                avatarIdMap.get(normalizedId).push(avatar);
            });

            // Find duplicates (groups with 2+ avatars)
            const duplicates = [];
            avatarIdMap.forEach((avatars, avatarId) => {
                if (avatars.length >= 2) {
                    duplicates.push({ avatarId, avatars });
                }
            });

            // Failsafe 3: Check if there are any duplicates
            if (duplicates.length === 0) {
                showNotification("No duplicate avatars found. All avatar IDs are unique.", 3000);
                return;
            }

            // Save undo state before making changes
            saveUndoState();

            // Failsafe 4: Show confirmation with details
            const totalDuplicates = duplicates.reduce((sum, dup) => sum + dup.avatars.length - 1, 0);
            const duplicateDetails = duplicates.map(dup => 
                `"${dup.avatarId}": ${dup.avatars.length} copies (keeping 1, removing ${dup.avatars.length - 1})`
            ).join('\n');

            const confirmMessage = `Found ${duplicates.length} duplicate avatar ID(s).\n\n${duplicateDetails}\n\nTotal avatars to remove: ${totalDuplicates}\n\nProceed with removal?`;
            
            if (!confirm(confirmMessage)) {
                // Clear undo state if user cancels
                localStorage.removeItem(STORAGE_KEY_UNDO);
                localStorage.removeItem(STORAGE_KEY_FOLDERS_UNDO);
                updateUndoButtonState();
                return;
            }

            // Remove duplicates, keeping the first occurrence of each ID
            // Strategy: Keep the first one we encounter, remove all others
            const idsToRemove = new Set();
            const seenIds = new Set();

            duplicates.forEach(({ avatarId, avatars }) => {
                // Keep the first avatar, mark others for removal
                let firstKept = false;
                avatars.forEach(avatar => {
                    if (!firstKept) {
                        // Keep the first one
                        firstKept = true;
                    } else {
                        // Mark subsequent ones for removal
                        idsToRemove.add(avatar.id);
                    }
                });
            });

            // Failsafe 5: Validate we're not removing all avatars
            if (idsToRemove.size >= allAvatars.length) {
                showNotification("Error: Would remove all avatars. Aborting for safety.", 5000);
                return;
            }

            // Failsafe 6: Double-check that we have valid IDs to remove
            const idsToRemoveArray = Array.from(idsToRemove).filter(id => id && typeof id === 'string');
            if (idsToRemoveArray.length === 0) {
                showNotification("Error: No valid avatar IDs to remove. Aborting.", 5000);
                return;
            }

            // Remove duplicates
            const remainingAvatars = allAvatars.filter(avatar => !idsToRemove.has(avatar.id));

            // Failsafe 7: Verify we still have avatars after removal
            if (remainingAvatars.length === 0) {
                showNotification("Error: Would remove all avatars. Aborting for safety.", 5000);
                return;
            }

            // Save the cleaned list
            saveAvatarsToStorage(remainingAvatars);
            renderCurrentView();
            showNotification(`Removed ${idsToRemoveArray.length} duplicate avatar(s). Kept ${remainingAvatars.length} unique avatar(s).`, 5000);
        };

        if (removeDuplicatesBtn) {
            removeDuplicatesBtn.addEventListener('click', removeDuplicateAvatars);
        }

        // --- New Folder Export Function ---
        const handleExportFolder = (folderId, folderName) => {
            const allAvatars = getAvatarsFromStorage();
                const avatarsToExport = allAvatars.filter(avatar => avatar.folderId === folderId);

            if (avatarsToExport.length === 0) {
                showNotification("This folder is empty. Nothing to export.", 3000);
                return;
            }

            // Format: ID,Name,Author,ImageURL
            const header = "ID,Name,Author,ImageURL\n";
            const csvContent = avatarsToExport.map(avatar => {
                return [
                    csvEscape(avatar.avatarId || ''),
                    csvEscape(avatar.avatarName || 'Unnamed'),
                    csvEscape(avatar.creatorName || 'Unknown'),
                    csvEscape(avatar.imageUrl || '')
                ].join(',');
            }).join('\n');
            
            const fullExportData = '\ufeff' + header + csvContent; // add BOM for Excel/Windows

            // Create and trigger download
            const blob = new Blob([fullExportData], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");
            
            // Sanitize folder name for filename
            const safeFolderName = (folderName || 'folder').replace(/[^a-z0-9]/gi, '_').toLowerCase();

            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `vrchat_avatars_${safeFolderName}.txt`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showNotification(`Exported ${avatarsToExport.length} avatars from "${folderName}".`, 3000);
            } else {
                showNotification("Export failed: Your browser does not support this feature.", 5000);
            }
        };

        // --- New Mass Export Function ---
        const handleMassExport = () => {
            const idsToExport = getSelectedAvatarIds();
            if (idsToExport.length === 0) {
                showNotification("No avatars selected to export.", 3000);
                return;
            }

            const allAvatars = getAvatarsFromStorage();
            const avatarsToExport = allAvatars.filter(avatar => idsToExport.includes(avatar.id));
            
            // Format: ID,Name,Author,ImageURL
            const header = "ID,Name,Author,ImageURL\n";
            const csvContent = avatarsToExport.map(avatar => {
                // This format matches the import parser (with quotes/escaping)
                return [
                    csvEscape(avatar.avatarId || ''),
                    csvEscape(avatar.avatarName || 'Unnamed'),
                    csvEscape(avatar.creatorName || 'Unknown'),
                    csvEscape(avatar.imageUrl || '')
                ].join(',');
            }).join('\n');
            
            const fullExportData = '\ufeff' + header + csvContent; // add BOM for Excel/Windows

            // Create and trigger download
            const blob = new Blob([fullExportData], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");
            
            if (link.download !== undefined) { // Check for browser support
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "vrchat_avatars_export.txt");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showNotification(`Exported ${idsToExport.length} avatars.`, 3000);
            } else {
                showNotification("Export failed: Your browser does not support this feature.", 5000);
            }
        };

        massEditBtn.addEventListener('click', toggleMassEditMode);
        cancelMassEditBtn.addEventListener('click', toggleMassEditMode);
        massExportBtn.addEventListener('click', handleMassExport); // Wire up the new button
        // Global Import/Export wiring
        exportAllBtn.addEventListener('click', exportAllData);
        importAllBtn.addEventListener('click', () => importFileInput.click());
        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const text = evt.target && evt.target.result ? String(evt.target.result) : '';
                importAllDataFromText(text);
                importFileInput.value = '';
            };
            reader.onerror = () => {
                showNotification('Failed to read the selected file.', 5000);
                importFileInput.value = '';
            };
            reader.readAsText(file, 'utf-8');
        });

        // --- Initialize ---
        window.onload = () => {
            // 1. Migrate avatar data for folders
            let avatars = getAvatarsFromStorage();
            let needsSave = false;
            avatars = avatars.map(avatar => {
                if (avatar.folderId === undefined) {
                    needsSave = true;
                    return { ...avatar, folderId: null };
                }
                return avatar;
            });
            if (needsSave) {
                console.log("Migrating avatars to include folderId property...");
                saveAvatarsToStorage(avatars);
            }

            // 2. Render UI
            renderFolderOptions(); // Populates the 'move to' dropdown
            renderCurrentView(); // Renders the initial root view
            updateUndoButtonState(); // Update undo button state on load
        };

    </script>
</body>
</html>
